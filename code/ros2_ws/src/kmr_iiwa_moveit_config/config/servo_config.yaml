# servo_config.yaml - MoveIt Servo konfiguracija za kmr_iiwa arm.
#
# PRVI POKUSAJ - servo_parameters.yaml ima puno vise parametara nego sto
# sam ovdje pokrio (nisam mogao dobiti pun sluzbeni popis direktno, samo
# dokumentirane fragmente preko pretrage). Ako servo_node odbije pokrenuti
# se zbog "missing parameter" ili slicne greske, usporedi ovo s pravim
# referentnim fajlom:
#   ros2 pkg prefix moveit_servo
#   # pa pogledaj share/moveit_servo/config/panda_simulated_config.yaml
# (ili moveit_ros/moveit_servo/config/servo_parameters.yaml u izvoru) i
# dodaj sto nedostaje.
#
# NAMJERNO RAVAN format (bez "moveit_servo:" ili "ros__parameters:" omotaca
# na vrhu) - omotavanje u ispravan oblik za Node parametar radi launch fajl
# (servo.launch.py), isti obrazac kao sluzbeni MoveIt primjeri.

move_group_name: iiwa_arm
joint_topic: /joint_states
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
status_topic: ~/status
command_out_topic: /arm_controller/joint_trajectory
command_out_type: trajectory_msgs/JointTrajectory

planning_frame: base_link
ee_frame_name: gripper_tcp
robot_link_command_frame: base_link

# move_group.launch.py (odvojen proces) je vec "primarni" planning scene
# monitor - servo NE smije preuzeti tu ulogu, inace sudar.
is_primary_planning_scene_monitor: false

check_collisions: false
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02

# Namjerno nisko - zelimo spor, kontroliran pokret za finalni grasp-dive,
# ne brzo/agresivno servoiranje.
publish_period: 0.034  # ~30Hz
low_pass_filter_coeff: 2.0
smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin
incoming_command_timeout: 0.5
num_outgoing_halt_msgs_to_publish: 4

lower_singularity_threshold: 60.0
hard_stop_singularity_threshold: 90.0
leaving_singularity_threshold_multiplier: 2.0

joint_limit_margin: 0.1
use_gazebo: false
